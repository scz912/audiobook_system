# Builds an UNSIGNED iOS .ipa on a GitHub macOS machine (no Mac needed).
# Start it from GitHub: Actions -> Build iOS IPA -> Run workflow.
# The .ipa must be signed (e.g. with Sideloadly + an Apple ID) before an
# iPhone will install it.
name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr app-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: frontend/app-unsigned.ipa
